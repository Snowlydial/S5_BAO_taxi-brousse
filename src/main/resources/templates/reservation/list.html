<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Reservations List</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Liste des Réservations</h1>
            <a href="/busvoyage/search" class="btn btn-primary">+ Nouvelle Réservation</a>
        </div>
        
        <div th:if="${#lists.isEmpty(reservations)}" class="alert alert-info">
            Aucune réservation trouvée.
        </div>
        
        <div th:if="${!#lists.isEmpty(reservations)}" class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Client</th>
                                <th>Trajet</th>
                                <th>Bus</th>
                                <th>Date/Heure</th>
                                <th>Place N°</th>
                                <th>Prix</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="reservation : ${reservations}">
                                <td th:text="${reservation.id}">1</td>
                                <td>
                                    <strong th:text="${reservation.client.nom + ' ' + reservation.client.prenom}">Client</strong><br>
                                    <small class="text-muted" th:text="${reservation.client.categorieGroupeAge.libelle}">Age</small>
                                </td>
                                <td>
                                    <span th:text="${reservation.busVoyage.voyage.gareDepart.libelle}">Départ</span>
                                    →
                                    <span th:text="${reservation.busVoyage.voyage.gareArrivee.libelle}">Arrivée</span>
                                </td>
                                <td>
                                    <span th:text="${reservation.busVoyage.bus.immatriculation}">Bus</span><br>
                                    <span class="badge bg-info" th:text="${reservation.busVoyage.bus.busClasse.libelle}">Classe</span>
                                </td>
                                <td>
                                    <span th:text="${#temporals.format(reservation.busVoyage.dateDepart, 'dd/MM/yyyy')}">Date</span><br>
                                    <span th:text="${#temporals.format(reservation.busVoyage.heureDepart, 'HH:mm')}">Heure</span>
                                </td>
                                <td>
                                    <span class="badge bg-primary" th:text="${reservation.numeroPlace}">1</span>
                                </td>
                                <td>
                                    <span class="text-success fw-bold">
                                        <span th:with="price=${reservation.busVoyage.prixSpecifique != null ? reservation.busVoyage.prixSpecifique : (reservation.busVoyage.voyage.prixVoyage != null ? reservation.busVoyage.voyage.prixVoyage : reservation.busVoyage.bus.busClasse.prixClasse)}"
                                              th:text="${#numbers.formatDecimal(price, 0, 'COMMA', 0, 'POINT')}">0</span>
                                    </span> Ar
                                </td>
                                <td>
                                    <form th:action="@{/reservation/cancel/{id}(id=${reservation.id})}" 
                                          method="post" style="display: inline;"
                                          onsubmit="return confirm('Confirmer l\'annulation de cette réservation?');">
                                        <button type="submit" class="btn btn-sm btn-danger">Annuler</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/dashboard" class="btn btn-secondary">← Retour au Tableau de Bord</a>
        </div>
    </div>
</body>
</html>
