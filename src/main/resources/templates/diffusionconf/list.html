<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Configuration des Tarifs - Diffusion</title>
    <link rel="stylesheet" th:href="@{/vendors/simple-datatables/style.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3>Configuration des Tarifs - Diffusion</h3>
                    <p class="text-subtitle text-muted">Gérez les tarifs de diffusion publicitaire</p>
                </div>
                <div class="col-12 col-md-6 order-md-2 order-first">
                    <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Tableau de Bord</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Tarifs Diffusion</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="card-title mb-0">Tarifs de Diffusion</h4>
                <a th:href="@{/diffusionconf/create}" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus"></i> Nouveau Tarif
                </a>
            </div>
            <div class="card-body">
                <!-- Success/Error Messages -->
                <div th:if="${session.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>Succès!</strong> <span th:text="${session.success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${session.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Erreur!</strong> <span th:text="${session.error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Empty State -->
                <div th:if="${#lists.isEmpty(configs)}" class="alert alert-info">
                    Aucun tarif configuré. <a th:href="@{/diffusionconf/create}">Créer le premier tarif</a>
                </div>

                <!-- Table -->
                <div th:if="${!#lists.isEmpty(configs)}" class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Prix (Ar)</th>
                            <th>Date Début</th>
                            <th>Date Fin</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="config : ${configs}">
                            <td>
                                <strong th:text="${#numbers.formatDecimal(config.prix, 0, 'COMMA', 0, 'POINT')}"></strong>
                            </td>
                            <td th:text="${#temporals.format(config.dateDebut, 'dd/MM/yyyy')}"></td>
                            <td th:text="${#temporals.format(config.dateFin, 'dd/MM/yyyy')}"></td>
                            <td>
                                <a th:href="@{/diffusionconf/edit/{id}(id=${config.id})}"
                                   class="btn btn-sm btn-warning" title="Modifier">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/diffusionconf/delete/{id}(id=${config.id})}"
                                      method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('Êtes-vous sûr?')" title="Supprimer">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
