<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Modifier Tarif - Diffusion</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3>Modifier Tarif Diffusion</h3>
                    <p class="text-subtitle text-muted">Modifier une configuration de tarif existante</p>
                </div>
                <div class="col-12 col-md-6 order-md-2 order-first">
                    <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Tableau de Bord</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/diffusionconf/list}">Tarifs Diffusion</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Modifier</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-body">
                <!-- Error Messages -->
                <div th:if="${session.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Erreur!</strong> <span th:text="${session.error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/diffusionconf/edit/{id}(id=${diffusionConf.id})}" method="post" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Prix (Ar) *</label>
                        <input type="number" step="0.01" min="0.01" name="prix" class="form-control" required
                               th:value="${diffusionConf.prix}"
                               placeholder="Montant en Ariary">
                        <small class="text-muted">Le prix doit être supérieur à 0</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date Début *</label>
                        <input type="date" name="dateDebut" class="form-control" required
                               th:value="${#temporals.format(diffusionConf.dateDebut, 'yyyy-MM-dd')}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date Fin *</label>
                        <input type="date" name="dateFin" class="form-control" required
                               th:value="${#temporals.format(diffusionConf.dateFin, 'yyyy-MM-dd')}">
                        <small class="text-muted">Doit être après la date de début</small>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check"></i> Modifier Tarif
                        </button>
                        <a th:href="@{/diffusionconf/list}" class="btn btn-secondary">
                            <i class="bi bi-x"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>
</body>
</html>
