<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Modifier Configuration</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-heading">
            <div class="page-title">
                <div class="row">
                    <div class="col-12 col-md-6 order-md-1 order-last">
                        <h3>Modifier Configuration Bus</h3>
                        <p class="text-subtitle text-muted">Modifier la configuration</p>
                    </div>
                    <div class="col-12 col-md-6 order-md-2 order-first">
                        <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Tableau de Bord</a></li>
                                <li class="breadcrumb-item"><a th:href="@{/busconf/list}">Configurations</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Modifier</li>
                            </ol>
                        </nav>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <section class="section">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">Configuration #<span th:text="${busConf.id}"></span></h4>
                </div>
                <div class="card-content">
                    <div class="card-body">
                        <form th:action="@{/busconf/edit/{id}(id=${busConf.id})}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Type (Libellé) *</label>
                                    <input type="text" 
                                           name="libelle" 
                                           class="form-control" 
                                           th:value="${busConf.libelle}"
                                           required>
                                    <small class="form-text text-muted">
                                        Type de configuration (en minuscules)
                                    </small>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Valeur *</label>
                                    <input type="text" 
                                           name="valeur" 
                                           class="form-control" 
                                           th:value="${busConf.valeur}"
                                           required>
                                    <small class="form-text text-muted">
                                        Valeur de la configuration
                                    </small>
                                </div>

                                <div class="col-12 mb-3">
                                    <div class="alert alert-light-warning">
                                        <h6><i class="bi bi-exclamation-triangle me-2"></i>Attention</h6>
                                        <p class="mb-0">
                                            La modification de cette configuration affectera tous les bus qui l'utilisent.
                                        </p>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-save me-1"></i> Enregistrer les modifications
                                        </button>
                                        <a th:href="@{/busconf/list}" class="btn btn-secondary">
                                            <i class="bi bi-x-circle me-1"></i> Annuler
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
